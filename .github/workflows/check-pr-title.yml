name: Check PR title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  check-pr-title:
    runs-on: ubuntu-slim

    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            btop
            chrome
            fastfetch
            hypr
            kitty
            micro
            spicetify
            starship
            thunar
            uwsm
            vscode
            zed
            zsh

            manifest
            packages
          subjectPattern: ^(?![A-Z]).+$ # No starting with uppercase
          subjectPatternError: The subject must not start with an uppercase character.
